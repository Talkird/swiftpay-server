name: Deploy to EC2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    defaults:
      run:
        working-directory: ./terraform

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      INFRACOST_CLI_AUTHENTICATION_TOKEN: ${{ secrets.INFRACOST_CLI_AUTHENTICATION_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive .
        continue-on-error: true

      - name: Terraform Validate
        run: terraform validate
        env:
          TF_VAR_key_pair_name: swiftpay-key

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        env:
          TF_VAR_key_pair_name: swiftpay-key

      - name: Install Infracost
        run: curl -fsSL https://raw.githubusercontent.com/infracost/cli/master/scripts/install.sh | sh

      - name: Run Infracost Scan
        run: infracost scan . --json > infracost-inspect.json

      - name: Send Infracost Data to Lambda
        run: |
          cat infracost-inspect.json | curl -X POST https://6i0kggdgzh.execute-api.us-east-1.amazonaws.com/analyze \
            -H "Content-Type: application/json" \
            -H "X-PR-Number: ${{ github.event.pull_request.number }}" \
            -H "X-Author: ${{ github.actor }}" \
            -H "X-Branch: ${{ github.head_ref }}" \
            -d @-

  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: ./terraform

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      INFRACOST_CLI_AUTHENTICATION_TOKEN: ${{ secrets.INFRACOST_CLI_AUTHENTICATION_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate
        env:
          TF_VAR_key_pair_name: swiftpay-key

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        env:
          TF_VAR_key_pair_name: swiftpay-key

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_key_pair_name: swiftpay-key

      - name: Get Instance Details
        id: instance
        run: |
          INSTANCE_ID=$(terraform output -raw instance_id)
          INSTANCE_IP=$(terraform output -raw instance_private_ip)
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "instance_ip=$INSTANCE_IP" >> $GITHUB_OUTPUT

      - name: Wait for Systems Manager to be ready
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        run: |
          echo "Waiting for Systems Manager agent to start (max 5 minutes)..."

          # Retry up to 60 times (5 minutes with 5 second intervals)
          MAX_ATTEMPTS=60
          ATTEMPT=1

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: Checking if instance is ready for SSM..."
            
            # Try to describe the instance and check its ping status
            PING_STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || echo "NotReady")
            
            if [ "$PING_STATUS" = "Online" ]; then
              echo "✓ Instance is ready for Systems Manager!"
              break
            fi
            
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "Instance not ready yet (Status: $PING_STATUS). Waiting 5 seconds..."
              sleep 5
            fi
            
            ATTEMPT=$((ATTEMPT + 1))
          done

          if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
            echo "❌ Instance did not become ready within 5 minutes"
            echo "Checking instance state..."
            aws ec2 describe-instances --instance-ids $INSTANCE_ID \
              --query 'Reservations[0].Instances[0].[State.Name,IamInstanceProfile]' \
              --output table
            exit 1
          fi

      - name: Deploy application via Systems Manager Send-Command
        env:
          NODE_ENV: ${{ secrets.NODE_ENV }}
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        run: |
          # Execute deployment commands directly via SSM send-command
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "#!/bin/bash",
              "set -e",
              "",
              "echo \"=== Starting Deployment ===\"",
              "",
              "# Wait for DNS and network to be ready",
              "echo \"Checking network connectivity...\"",
              "for i in {1..30}; do",
              "  if ping -c 1 8.8.8.8 &> /dev/null; then",
              "    echo \"✓ Network is online\"",
              "    break",
              "  fi",
              "  echo \"Attempt $i/30: Waiting for network...\"",
              "  sleep 2",
              "done",
              "",
              "# Wait for DNS to resolve",
              "echo \"Checking DNS resolution...\"",
              "for i in {1..30}; do",
              "  if nslookup github.com 8.8.8.8 &> /dev/null; then",
              "    echo \"✓ DNS is working\"",
              "    break",
              "  fi",
              "  echo \"Attempt $i/30: Waiting for DNS...\"",
              "  sleep 2",
              "done",
              "",
              "# Install Node.js if not already installed",
              "if ! command -v node &> /dev/null; then",
              "  echo \"Installing Node.js...\"",
              "  export DEBIAN_FRONTEND=noninteractive",
              "  curl -sL https://deb.nodesource.com/setup_20.x | sudo -E bash -",
              "  sudo apt-get update",
              "  sudo DEBIAN_FRONTEND=noninteractive apt-get install -y nodejs",
              "  echo \"✓ Node.js installed: $(node -v)\"",
              "fi",
              "",
              "# Clone or update repo with retries",
              "echo \"Setting up application repository...\"",
              "mkdir -p /home/ubuntu",
              "cd /home/ubuntu",
              "",
              "CLONE_RETRY=5",
              "CLONE_SUCCESS=false",
              "while [ $CLONE_RETRY -gt 0 ]; do",
              "  if [ -d swiftpay-server ]; then",
              "    echo \"Repository exists, updating...\"",
              "    cd swiftpay-server",
              "    if git pull origin main; then",
              "      CLONE_SUCCESS=true",
              "      break",
              "    fi",
              "    cd ..",
              "  else",
              "    echo \"Cloning repository (attempt $((6 - CLONE_RETRY))/5)...\"",
              "    if git clone --depth 1 https://github.com/losau/swiftpay-server.git; then",
              "      cd swiftpay-server",
              "      CLONE_SUCCESS=true",
              "      break",
              "    fi",
              "  fi",
              "  CLONE_RETRY=$((CLONE_RETRY - 1))",
              "  if [ $CLONE_RETRY -gt 0 ]; then",
              "    echo \"Clone failed, retrying in 5 seconds...\"",
              "    sleep 5",
              "  fi",
              "done",
              "",
              "if [ \"$CLONE_SUCCESS\" != \"true\" ]; then",
              "  echo \"❌ Failed to clone repository after 5 attempts\"",
              "  exit 1",
              "fi",
              "",
              "echo \"✓ Repository ready\"",
              "echo \"Current directory: $(pwd)\"",
              "echo \"Files: $(ls -la)\"",
              "",
              "# Install dependencies",
              "echo \"Installing dependencies...\"",
              "npm install --production",
              "",
              "# Kill any existing node process",
              "killall node || true",
              "sleep 1",
              "",
              "# Start the application",
              "echo \"Starting application with NODE_ENV=${{ secrets.NODE_ENV }}\"",
              "export NODE_ENV=${{ secrets.NODE_ENV }}",
              "nohup node src/app.js > src/app.log 2>&1 &",
              "",
              "sleep 3",
              "",
              "# Test the health endpoint",
              "echo \"Testing health endpoint...\"",
              "curl -s http://127.0.0.1:3000/health && echo \"✓ Health check passed\" || echo \"⚠ Health check not available yet\"",
              "",
              "echo \"=== Deployment Complete ===\""
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "Deployment command ID: $COMMAND_ID"

          # Wait for command to complete
          MAX_WAIT=600
          ELAPSED=0
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text)
            
            echo "[$(date)] Status: $STATUS"
            
            if [ "$STATUS" = "Success" ]; then
              echo ""
              echo "✓ Deployment successful!"
              echo ""
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'StandardOutputContent' \
                --output text
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelling" ] || [ "$STATUS" = "Cancelled" ]; then
              echo ""
              echo "❌ Deployment failed with status: $STATUS"
              echo ""
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'StandardErrorContent' \
                --output text
              exit 1
            fi
            
            sleep 5
            ELAPSED=$((ELAPSED + 5))
          done

          if [ $ELAPSED -ge $MAX_WAIT ]; then
            echo "❌ Deployment timed out after $MAX_WAIT seconds"
            exit 1
          fi

      - name: Verify Deployment
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        run: |
          echo "✓ Deployment completed successfully!"
          echo "Instance ID: $INSTANCE_ID"
          echo ""
          echo "To check application status:"
          echo "1. Go to AWS Console → EC2 → Instances → swiftpay-server"
          echo "2. Click 'Connect' → 'Session Manager' → 'Connect'"
          echo "3. Run: curl http://127.0.0.1:3000/health"
          echo ""
          echo "Or run locally:"
          echo "aws ssm start-session --target $INSTANCE_ID"
          echo "curl http://127.0.0.1:3000/health"
