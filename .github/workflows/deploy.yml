name: Deploy to EC2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./terraform

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      INFRACOST_CLI_AUTHENTICATION_TOKEN: ${{ secrets.INFRACOST_CLI_AUTHENTICATION_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Validate
        run: terraform validate
        env:
          TF_VAR_key_pair_name: swiftpay-key

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        env:
          TF_VAR_key_pair_name: swiftpay-key

      - name: Install Infracost
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: curl -fsSL https://raw.githubusercontent.com/infracost/cli/master/scripts/install.sh | sh

      - name: Infracost Auth Login
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: infracost auth login --oauth-use-device-flow
        continue-on-error: true

      - name: Run Infracost Scan
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: infracost scan .

      - name: Run Infracost Inspect
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: infracost inspect --json > infracost-inspect.json

      - name: Send Infracost Data to Lambda
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          curl -X POST https://6i0kggdgzh.execute-api.us-east-1.amazonaws.com/analyze \
            -H "Content-Type: application/json" \
            -d @infracost-inspect.json

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_key_pair_name: swiftpay-key

      - name: Get Instance IP
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: echo "INSTANCE_IP=$(terraform output -raw instance_public_ip)" >> $GITHUB_ENV

      - name: Wait for instance to be ready
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: sleep 5

      - name: Deploy application
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/swiftpay-key.pem << 'EOF'
          ${{ secrets.EC2_KEY_PAIR }}
          EOF
          chmod 600 ~/.ssh/swiftpay-key.pem

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/swiftpay-key.pem ubuntu@${{ env.INSTANCE_IP }} <<'DEPLOY'
            set -e
            
            # Install Node.js
            curl -sL https://deb.nodesource.com/setup_20.x | sudo -E bash -
            sudo apt-get install -y nodejs
            
            # Clone repo and install dependencies
            cd /home/ubuntu
            if [ -d swiftpay-server ]; then
              cd swiftpay-server
              git pull origin main
            else
              git clone https://github.com/Talkird/swiftpay-server.git
              cd swiftpay-server
            fi
            npm install
            
            # Start the application
            cd src
            killall node
            node app.js > app.log 2>&1 &
          DEPLOY
