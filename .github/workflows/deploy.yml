name: Deploy to EC2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./terraform

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Validate
        run: terraform validate
        env:
          TF_VAR_key_pair_name: swiftpay-key

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        env:
          TF_VAR_key_pair_name: swiftpay-key

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_key_pair_name: swiftpay-key

      - name: Get Instance IP
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: echo "INSTANCE_IP=$(terraform output -raw instance_public_ip)" >> $GITHUB_ENV

      - name: Wait for instance to be ready
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: sleep 5

      - name: Deploy application
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/swiftpay-key.pem << 'EOF'
          ${{ secrets.EC2_KEY_PAIR }}
          EOF
          chmod 600 ~/.ssh/swiftpay-key.pem

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/swiftpay-key.pem ubuntu@${{ env.INSTANCE_IP }} <<'DEPLOY'
            set -e
            
            # Install Node.js
            curl -sL https://deb.nodesource.com/setup_20.x | sudo -E bash -
            sudo apt-get install -y nodejs
            
            # Clone repo and install dependencies
            cd /home/ubuntu
            git clone https://github.com/Talkird/swiftpay-server.git
            cd swiftpay-server
            npm install
            
            # Start the application
            npm start > /var/log/swiftpay.log 2>&1 &
          DEPLOY
