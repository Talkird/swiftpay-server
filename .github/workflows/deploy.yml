name: Deploy to EC2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action != 'closed'

    defaults:
      run:
        working-directory: ./terraform

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      INFRACOST_CLI_AUTHENTICATION_TOKEN: ${{ secrets.INFRACOST_CLI_AUTHENTICATION_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive .
        continue-on-error: true

      - name: Terraform Validate
        run: terraform validate
        env:
          TF_VAR_key_pair_name: swiftpay-key

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        env:
          TF_VAR_key_pair_name: swiftpay-key

      - name: Install Infracost
        run: curl -fsSL https://raw.githubusercontent.com/infracost/cli/master/scripts/install.sh | sh

      - name: Run Infracost Scan
        run: infracost scan . --json > infracost-inspect.json

      - name: Send Infracost Data to Lambda
        run: |
          cat infracost-inspect.json | curl -X POST https://6i0kggdgzh.execute-api.us-east-1.amazonaws.com/analyze \
            -H "Content-Type: application/json" \
            -H "X-PR-Number: ${{ github.event.pull_request.number }}" \
            -H "X-Author: ${{ github.actor }}" \
            -H "X-Branch: ${{ github.head_ref }}" \
            -d @-

  update_pr_status:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Determine pull request status
        id: status
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
        run: |
          if [ "$PR_MERGED" = "true" ]; then
            STATUS="merged"
          else
            STATUS="closed"
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Update pull request status in MongoDB
        run: |
          curl -sS -X POST https://6i0kggdgzh.execute-api.us-east-1.amazonaws.com/updatePullRequestStatus \
            -H "Content-Type: application/json" \
            -d "{\"prNumber\":\"${{ steps.status.outputs.pr_number }}\",\"status\":\"${{ steps.status.outputs.status }}\"}"

  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: ./terraform

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      INFRACOST_CLI_AUTHENTICATION_TOKEN: ${{ secrets.INFRACOST_CLI_AUTHENTICATION_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate
        env:
          TF_VAR_key_pair_name: swiftpay-key

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        env:
          TF_VAR_key_pair_name: swiftpay-key

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_key_pair_name: swiftpay-key

      - name: Get Instance Details
        id: instance
        run: |
          INSTANCE_ID=$(terraform output -raw instance_id)
          INSTANCE_IP=$(terraform output -raw instance_private_ip)
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "instance_ip=$INSTANCE_IP" >> $GITHUB_OUTPUT

      - name: Wait for Systems Manager to be ready
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        run: |
          echo "Waiting for Systems Manager agent to start (max 5 minutes)..."

          # Retry up to 60 times (5 minutes with 5 second intervals)
          MAX_ATTEMPTS=60
          ATTEMPT=1

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: Checking if instance is ready for SSM..."
            
            # Try to describe the instance and check its ping status
            PING_STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || echo "NotReady")
            
            if [ "$PING_STATUS" = "Online" ]; then
              echo "✓ Instance is ready for Systems Manager!"
              break
            fi
            
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "Instance not ready yet (Status: $PING_STATUS). Waiting 5 seconds..."
              sleep 5
            fi
            
            ATTEMPT=$((ATTEMPT + 1))
          done

          if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
            echo "❌ Instance did not become ready within 5 minutes"
            echo "Checking instance state..."
            aws ec2 describe-instances --instance-ids $INSTANCE_ID \
              --query 'Reservations[0].Instances[0].[State.Name,IamInstanceProfile]' \
              --output table
            exit 1
          fi

      - name: Deploy application via Systems Manager Send-Command
        env:
          NODE_ENV: ${{ secrets.NODE_ENV }}
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        run: |
          # Execute deployment commands directly via SSM send-command
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "#!/bin/bash",
              "",
              "exec 2>&1",
              "set +e",
              "",
              "echo \"=== Starting Deployment ===\"",
              "",
              "# Set environment variables that SSM may not have",
              "export HOME=/root",
              "export USER=root",
              "export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
              "export SHELL=/bin/bash",
              "",
              "echo \"Environment: HOME=$HOME, USER=$USER\"",
              "echo \"PATH=$PATH\"",
              "",
              "# Wait for network to be fully ready",
              "echo \"Waiting for network connectivity...\"",
              "NETWORK_READY=false",
              "for i in {1..60}; do",
              "  if curl -s --connect-timeout 5 -m 5 https://github.com > /dev/null 2>&1; then",
              "    echo \"✓ Network is online\"",
              "    NETWORK_READY=true",
              "    break",
              "  fi",
              "  echo \"Attempt $i/60: Waiting for network...\"",
              "  sleep 2",
              "done",
              "",
              "if [ \"$NETWORK_READY\" != \"true\" ]; then",
              "  echo \"⚠ Network check timed out, waiting 10 more seconds...\"",
              "  sleep 10",
              "fi",
              "",
              "# Install Node.js if not already installed",
              "echo \"\"",
              "echo \"Checking for Node.js...\"",
              "if ! command -v node &> /dev/null; then",
              "  echo \"Installing Node.js...\"",
              "  export DEBIAN_FRONTEND=noninteractive",
              "  echo \"Waiting for apt/dpkg activity to finish...\"",
              "  for i in {1..60}; do",
              "    if pgrep -x apt >/dev/null 2>&1 || pgrep -x apt-get >/dev/null 2>&1 || pgrep -x dpkg >/dev/null 2>&1 || pgrep -x unattended-upgrade >/dev/null 2>&1; then",
              "      echo \"Attempt $i/60: apt/dpkg process still running, waiting 5 seconds...\"",
              "      sleep 5",
              "      continue",
              "    fi",
              "    if sudo fuser -s /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock /var/cache/apt/archives/lock; then",
              "      echo \"Attempt $i/60: apt lock still held, waiting 5 seconds...\"",
              "      sleep 5",
              "      continue",
              "    else",
              "      break",
              "    fi",
              "  done",
              "  for attempt in 1 2 3; do",
              "    if curl -sL https://deb.nodesource.com/setup_20.x | sudo -E bash -; then",
              "      break",
              "    fi",
              "    if [ $attempt -eq 3 ]; then",
              "      echo \"Error: Node setup failed\"",
              "      exit 1",
              "    fi",
              "    echo \"Node setup failed on attempt $attempt, retrying in 5 seconds...\"",
              "    sleep 5",
              "  done",
              "  sudo apt-get -o DPkg::Lock::Timeout=120 update || { echo \"Error: apt-get update failed\"; exit 1; }",
              "  sudo DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=120 install -y nodejs || { echo \"Error: Node install failed\"; exit 1; }",
              "  echo \"✓ Node.js installed: $(node -v)\"",
              "else",
              "  echo \"✓ Node.js already installed: $(node -v)\"",
              "fi",
              "",
              "# Configure git",
              "echo \"\"",
              "echo \"Configuring git...\"",
              "git config --global user.email \"deploy@swiftpay.local\" || true",
              "git config --global user.name \"SwiftPay Deployer\" || true",
              "git config --global http.connectTimeout 30 || true",
              "git config --global http.timeout 120 || true",
              "git config --list | head -10",
              "",
              "# Clone or update repo",
              "echo \"\"",
              "echo \"Setting up application repository...\"",
              "mkdir -p /home/ubuntu || { echo \"Error: mkdir failed\"; exit 1; }",
              "cd /home/ubuntu || { echo \"Error: cd to /home/ubuntu failed\"; exit 1; }",
              "echo \"Working in: $(pwd)\"",
              "",
              "CLONE_RETRY=5",
              "CLONE_SUCCESS=false",
              "while [ $CLONE_RETRY -gt 0 ]; do",
              "  echo \"\"",
              "  echo \"Clone attempt $((6 - CLONE_RETRY))/5\"",
              "  if [ -d swiftpay-server ]; then",
              "    echo \"Repository exists, updating...\"",
              "    cd swiftpay-server || { echo \"Error: cd swiftpay-server failed\"; break; }",
              "    if git pull origin main 2>&1; then",
              "      echo \"✓ Repository updated\"",
              "      CLONE_SUCCESS=true",
              "      break",
              "    else",
              "      echo \"⚠ Git pull failed, cleaning up...\"",
              "      cd /home/ubuntu || true",
              "      rm -rf swiftpay-server",
              "    fi",
              "  else",
              "    echo \"Cloning repository from GitHub...\"",
              "    if git clone --depth 1 https://github.com/Talkird/swiftpay-server.git 2>&1; then",
              "      cd swiftpay-server || { echo \"Error: cd swiftpay-server after clone failed\"; break; }",
              "      echo \"✓ Repository cloned\"",
              "      CLONE_SUCCESS=true",
              "      break",
              "    else",
              "      echo \"⚠ Clone failed\"",
              "    fi",
              "  fi",
              "  CLONE_RETRY=$((CLONE_RETRY - 1))",
              "  if [ $CLONE_RETRY -gt 0 ]; then",
              "    echo \"Waiting 10 seconds before retry...\"",
              "    sleep 10",
              "  fi",
              "done",
              "",
              "if [ \"$CLONE_SUCCESS\" != \"true\" ]; then",
              "  echo \"\"",
              "  echo \"❌ Failed to clone repository\"",
              "  exit 1",
              "fi",
              "",
              "echo \"\"",
              "echo \"✓ Repository ready\"",
              "pwd",
              "ls -la",
              "",
              "# Install dependencies",
              "echo \"\"",
              "echo \"Installing npm dependencies...\"",
              "npm install --production 2>&1 || { echo \"Error: npm install failed\"; exit 1; }",
              "echo \"✓ Dependencies installed\"",
              "",
              "# Kill any existing node process",
              "echo \"\"",
              "echo \"Cleaning up old processes...\"",
              "killall node || true",
              "sleep 1",
              "",
              "# Start the application",
              "echo \"\"",
              "echo \"Starting application with NODE_ENV=${{ secrets.NODE_ENV }}...\"",
              "export NODE_ENV=${{ secrets.NODE_ENV }}",
              "nohup node src/app.js > src/app.log 2>&1 &",
              "APP_PID=$!",
              "echo \"Application PID: $APP_PID\"",
              "sleep 3",
              "",
              "# Verify app is running",
              "if ps -p $APP_PID > /dev/null; then",
              "  echo \"✓ Application is running\"",
              "else",
              "  echo \"⚠ Application may have exited. Check logs:\"",
              "  tail -20 src/app.log",
              "fi",
              "",
              "# Test the health endpoint",
              "echo \"\"",
              "echo \"Testing health endpoint...\"",
              "HEALTH_CHECK=$(curl -s http://127.0.0.1:3000/health)",
              "if echo \"$HEALTH_CHECK\" | grep -q \"ok\"; then",
              "  echo \"✓ Health check passed\"",
              "  echo \"Response: $HEALTH_CHECK\"",
              "else",
              "  echo \"⚠ Health endpoint response: $HEALTH_CHECK\"",
              "fi",
              "",
              "echo \"\"",
              "echo \"=== Deployment Complete ===\"",
              "exit 0"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "Deployment command ID: $COMMAND_ID"

          # Wait for command to complete (15 minute timeout)
          MAX_WAIT=900
          ELAPSED=0
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text)
            
            echo "[$(date)] Status: $STATUS"
            
            if [ "$STATUS" = "Success" ]; then
              echo ""
              echo "✓ Deployment successful!"
              echo ""
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'StandardOutputContent' \
                --output text
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelling" ] || [ "$STATUS" = "Cancelled" ]; then
              echo ""
              echo "❌ Deployment failed"
              echo ""
              echo "=== Standard Output ==="
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'StandardOutputContent' \
                --output text
              echo ""
              echo "=== Error Output ==="
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'StandardErrorContent' \
                --output text
              exit 1
            fi
            
            sleep 5
            ELAPSED=$((ELAPSED + 5))
          done

          if [ $ELAPSED -ge $MAX_WAIT ]; then
            echo "❌ Deployment timed out after $MAX_WAIT seconds"
            exit 1
          fi

      - name: Verify Deployment
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        run: |
          echo "✓ Deployment completed successfully!"
          echo "Instance ID: $INSTANCE_ID"
          echo ""
          echo "To check application status:"
          echo "1. Go to AWS Console → EC2 → Instances → swiftpay-server"
          echo "2. Click 'Connect' → 'Session Manager' → 'Connect'"
          echo "3. Run: curl http://127.0.0.1:3000/health"
          echo ""
          echo "Or run locally:"
          echo "aws ssm start-session --target $INSTANCE_ID"
          echo "curl http://127.0.0.1:3000/health"

      - name: Update merged pull request status in MongoDB
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          PR_NUMBER=$(curl -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/commits/$SHA/pulls" | jq -r '.[0].number // empty')

          if [ -z "$PR_NUMBER" ]; then
            COMMIT_MESSAGE=$(curl -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/commits/$SHA" | jq -r '.commit.message // empty')

            PR_NUMBER=$(printf '%s' "$COMMIT_MESSAGE" | sed -nE 's/.*\(#([0-9]+)\).*/\1/p' | head -n 1)
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "No pull request found for commit $SHA; skipping status update."
            exit 0
          fi

          curl -sS -X POST https://6i0kggdgzh.execute-api.us-east-1.amazonaws.com/updatePullRequestStatus \
            -H "Content-Type: application/json" \
            -d "{\"prNumber\":\"$PR_NUMBER\",\"status\":\"merged\"}"
