name: Deploy to EC2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    defaults:
      run:
        working-directory: ./terraform

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      INFRACOST_CLI_AUTHENTICATION_TOKEN: ${{ secrets.INFRACOST_CLI_AUTHENTICATION_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Validate
        run: terraform validate
        env:
          TF_VAR_key_pair_name: swiftpay-key

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        env:
          TF_VAR_key_pair_name: swiftpay-key

      - name: Install Infracost
        run: curl -fsSL https://raw.githubusercontent.com/infracost/cli/master/scripts/install.sh | sh

      - name: Run Infracost Scan
        run: infracost scan . --json > infracost-inspect.json

      - name: Send Infracost Data to Lambda
        run: |
          cat infracost-inspect.json | curl -X POST https://6i0kggdgzh.execute-api.us-east-1.amazonaws.com/analyze \
            -H "Content-Type: application/json" \
            -H "X-PR-Number: ${{ github.event.pull_request.number }}" \
            -H "X-Author: ${{ github.actor }}" \
            -H "X-Branch: ${{ github.head_ref }}" \
            -d @-

  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: ./terraform

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      INFRACOST_CLI_AUTHENTICATION_TOKEN: ${{ secrets.INFRACOST_CLI_AUTHENTICATION_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Validate
        run: terraform validate
        env:
          TF_VAR_key_pair_name: swiftpay-key

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        env:
          TF_VAR_key_pair_name: swiftpay-key

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_key_pair_name: swiftpay-key

      - name: Get Instance Details
        id: instance
        run: |
          INSTANCE_ID=$(terraform output -raw instance_id)
          INSTANCE_IP=$(terraform output -raw instance_private_ip)
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "instance_ip=$INSTANCE_IP" >> $GITHUB_OUTPUT

      - name: Deploy application via Systems Manager Session Manager
        env:
          NODE_ENV: ${{ secrets.NODE_ENV }}
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        run: |
          # Create deployment script
          cat > /tmp/deploy.sh << 'DEPLOY_SCRIPT'
          #!/bin/bash
          set -e

          # Install Node.js if not already installed
          if ! command -v node &> /dev/null; then
            echo "Installing Node.js..."
            curl -sL https://deb.nodesource.com/setup_20.x | sudo -E bash -
            sudo apt-get install -y nodejs
            echo "Node.js installed"
          fi

          # Clone or update repo
          echo "Setting up application..."
          cd /home/ubuntu
          if [ -d swiftpay-server ]; then
            cd swiftpay-server
            git pull origin main
          else
            git clone https://github.com/Talkird/swiftpay-server.git
            cd swiftpay-server
          fi

          # Install dependencies
          npm install

          # Kill any existing node process
          killall node || true
          sleep 1

          # Start the application with environment variables
          export NODE_ENV=$NODE_ENV
          nohup node src/app.js > src/app.log 2>&1 &

          echo "Application started with NODE_ENV=$NODE_ENV"
          sleep 2

          # Test the health endpoint
          curl -f http://127.0.0.1:3000/health && echo "Health check passed" || echo "Health check not available yet"
          DEPLOY_SCRIPT

          chmod +x /tmp/deploy.sh

          # Execute deployment script via Systems Manager Session Manager
          aws ssm start-session \
            --target "$INSTANCE_ID" \
            --document-name "AWS-StartInteractiveCommand" \
            --parameters "command=['/bin/bash','/tmp/deploy.sh']"

      - name: Verify Deployment
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        run: |
          # Wait for app to start
          sleep 3

          # Verify via SSM
          aws ssm start-session \
            --target "$INSTANCE_ID" \
            --document-name "AWS-StartInteractiveCommand" \
            --parameters "command=['bash','-c','curl -f http://127.0.0.1:3000/health || (echo \"Health check failed\" && exit 1)']"
