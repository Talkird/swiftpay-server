name: Deploy to EC2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    defaults:
      run:
        working-directory: ./terraform

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      INFRACOST_CLI_AUTHENTICATION_TOKEN: ${{ secrets.INFRACOST_CLI_AUTHENTICATION_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive .
        continue-on-error: true

      - name: Terraform Validate
        run: terraform validate
        env:
          TF_VAR_key_pair_name: swiftpay-key

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        env:
          TF_VAR_key_pair_name: swiftpay-key

      - name: Install Infracost
        run: curl -fsSL https://raw.githubusercontent.com/infracost/cli/master/scripts/install.sh | sh

      - name: Run Infracost Scan
        run: infracost scan . --json > infracost-inspect.json

      - name: Send Infracost Data to Lambda
        run: |
          cat infracost-inspect.json | curl -X POST https://6i0kggdgzh.execute-api.us-east-1.amazonaws.com/analyze \
            -H "Content-Type: application/json" \
            -H "X-PR-Number: ${{ github.event.pull_request.number }}" \
            -H "X-Author: ${{ github.actor }}" \
            -H "X-Branch: ${{ github.head_ref }}" \
            -d @-

  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: ./terraform

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      INFRACOST_CLI_AUTHENTICATION_TOKEN: ${{ secrets.INFRACOST_CLI_AUTHENTICATION_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate
        env:
          TF_VAR_key_pair_name: swiftpay-key

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        env:
          TF_VAR_key_pair_name: swiftpay-key

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_key_pair_name: swiftpay-key

      - name: Get Instance Details
        id: instance
        run: |
          INSTANCE_ID=$(terraform output -raw instance_id)
          INSTANCE_IP=$(terraform output -raw instance_private_ip)
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "instance_ip=$INSTANCE_IP" >> $GITHUB_OUTPUT

      - name: Wait for Systems Manager to be ready
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        run: |
          echo "Waiting for Systems Manager agent to start (max 5 minutes)..."

          # Retry up to 60 times (5 minutes with 5 second intervals)
          MAX_ATTEMPTS=60
          ATTEMPT=1

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: Checking if instance is ready for SSM..."
            
            # Try to describe the instance and check its ping status
            PING_STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || echo "NotReady")
            
            if [ "$PING_STATUS" = "Online" ]; then
              echo "✓ Instance is ready for Systems Manager!"
              break
            fi
            
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "Instance not ready yet (Status: $PING_STATUS). Waiting 5 seconds..."
              sleep 5
            fi
            
            ATTEMPT=$((ATTEMPT + 1))
          done

          if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
            echo "❌ Instance did not become ready within 5 minutes"
            echo "Checking instance state..."
            aws ec2 describe-instances --instance-ids $INSTANCE_ID \
              --query 'Reservations[0].Instances[0].[State.Name,IamInstanceProfile]' \
              --output table
            exit 1
          fi

      - name: Deploy application via Systems Manager Send-Command
        env:
          NODE_ENV: ${{ secrets.NODE_ENV }}
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        run: |
          # Execute deployment commands directly via SSM send-command
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "#!/bin/bash",
              "set -e",
              "",
              "# Install Node.js if not already installed",
              "if ! command -v node &> /dev/null; then",
              "  echo \"Installing Node.js...\"",
              "  curl -sL https://deb.nodesource.com/setup_20.x | sudo -E bash -",
              "  sudo apt-get install -y nodejs",
              "  echo \"Node.js installed\"",
              "fi",
              "",
              "# Clone or update repo",
              "echo \"Setting up application...\"",
              "cd /home/ubuntu",
              "if [ -d swiftpay-server ]; then",
              "  cd swiftpay-server",
              "  git pull origin main",
              "else",
              "  git clone https://github.com/losau/swiftpay-server.git",
              "  cd swiftpay-server",
              "fi",
              "",
              "# Install dependencies",
              "npm install",
              "",
              "# Kill any existing node process",
              "killall node || true",
              "sleep 1",
              "",
              "# Start the application with environment variables",
              "export NODE_ENV=${{ secrets.NODE_ENV }}",
              "nohup node src/app.js > src/app.log 2>&1 &",
              "",
              "echo \"Application started with NODE_ENV=${{ secrets.NODE_ENV }}\"",
              "sleep 2",
              "",
              "# Test the health endpoint",
              "curl -f http://127.0.0.1:3000/health && echo \"Health check passed\" || echo \"Health check not available yet\""
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "Deployment command ID: $COMMAND_ID"

          # Wait for command to complete
          MAX_WAIT=300
          ELAPSED=0
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text)
            
            if [ "$STATUS" = "Success" ]; then
              echo "✓ Deployment successful!"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'StandardOutputContent' \
                --output text
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelling" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "❌ Deployment failed with status: $STATUS"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'StandardErrorContent' \
                --output text
              exit 1
            fi
            
            sleep 5
            ELAPSED=$((ELAPSED + 5))
          done

          if [ $ELAPSED -ge $MAX_WAIT ]; then
            echo "❌ Deployment timed out after $MAX_WAIT seconds"
            exit 1
          fi

      - name: Verify Deployment
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        run: |
          echo "✓ Deployment completed successfully!"
          echo "Instance ID: $INSTANCE_ID"
          echo ""
          echo "To check application status:"
          echo "1. Go to AWS Console → EC2 → Instances → swiftpay-server"
          echo "2. Click 'Connect' → 'Session Manager' → 'Connect'"
          echo "3. Run: curl http://127.0.0.1:3000/health"
          echo ""
          echo "Or run locally:"
          echo "aws ssm start-session --target $INSTANCE_ID"
          echo "curl http://127.0.0.1:3000/health"
